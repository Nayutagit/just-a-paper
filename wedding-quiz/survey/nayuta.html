<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テスト入力フォーム (那由他さん専用) | WEDDING QUIZ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-nayuta">
    <div class="container" id="survey-app">
        <!-- ヘッダー -->
        <header class="form-header-card">
            <div class="logo-text">TEST SURVEY</div>
            <div class="sub-title">那由他さん専用 テスト用アンケート入力フォーム</div>
            <p class="form-intro">那由他さん自身が新郎新婦の入力テストを行うための専用ページです。
新郎（魁さん役）または新婦（偲桜さん役）のどちらとして回答するかを選択して、入力・送信テストを行えます。

※テストデータもブラウザに自動保存され、管理者確認画面（results.html）へ自動同期されます。</p>
            <div style="margin-top: 1rem; font-size: 0.8rem; color: var(--text-secondary); display: flex; align-items: center; gap: 0.3rem;">
                <span id="save-status-icon">✓</span>
                <span id="save-status-text">下書きは自動保存されています</span>
            </div>
        </header>

        <!-- 立場選択トグル -->
        <div class="question-card" style="margin-bottom: 0.8rem; border-top: 3px solid var(--accent-color);">
            <label class="question-label" style="margin-bottom: 0.8rem;">
                入力するテストの役割を選択してください：
            </label>
            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <label style="flex: 1; cursor: pointer; min-width: 250px;">
                    <input type="radio" name="test-role" value="nayuta_groom" checked style="display:none;" id="role-groom-radio">
                    <div id="role-groom-btn" class="input-text" style="text-align: center; font-weight: 700; border: 1px solid var(--gold); border-radius: 4px; padding: 0.8rem; background: rgba(212, 175, 55, 0.1); color: var(--gold-light);">
                        🤵 新郎 (魁さん役) としてテスト
                    </div>
                </label>
                <label style="flex: 1; cursor: pointer; min-width: 250px;">
                    <input type="radio" name="test-role" value="nayuta_bride" style="display:none;" id="role-bride-radio">
                    <div id="role-bride-btn" class="input-text" style="text-align: center; font-weight: 700; border: 1px solid var(--border-color); border-radius: 4px; padding: 0.8rem;">
                        👰 新婦 (偲桜さん役) としてテスト
                    </div>
                </label>
            </div>
        </div>

        <!-- 入力フォーム -->
        <form id="survey-form" enctype="multipart/form-data">
            <!-- Q1. 呼び名 -->
            <div class="question-card">
                <label for="q1" class="question-label">Q1. 普段、お互いのことを何と呼んでいますか？また、その由来があれば教えてください。</label>
                <input type="text" id="q1" class="input-text" required>
            </div>

            <!-- Q2. 第一印象 -->
            <div class="question-card">
                <label for="q2" class="question-label">Q2. <span class="target-partner">偲桜</span>さんに初めて会った時の「第一印象」を教えてください。</label>
                <input type="text" id="q2" class="input-text" required>
            </div>

            <!-- Q3. デート場所 -->
            <div class="question-card">
                <label for="q3" class="question-label">Q3. お二人が初めてデートした「思い出の場所」はどこですか？</label>
                <input type="text" id="q3" class="input-text" required>
            </div>

            <!-- Q4. 手料理 -->
            <div class="question-card">
                <label for="q4" class="question-label">Q4. <span class="target-partner">偲桜</span>さんが作ってくれた手料理（得意料理）で「一番美味しかったもの」は何ですか？</label>
                <input type="text" id="q4" class="input-text" required>
            </div>

            <!-- Q5. プレゼント -->
            <div class="question-card">
                <label class="question-label">Q5. 今まで<span class="target-partner">偲桜</span>さんから貰ったプレゼントで、嬉しかったものランキングを教えてください。</label>
                <div class="ranking-inputs">
                    <div class="ranking-row">
                        <span class="ranking-badge">1位</span>
                        <input type="text" id="q5_1" class="input-text" required>
                    </div>
                    <div class="ranking-row">
                        <span class="ranking-badge">2位</span>
                        <input type="text" id="q5_2" class="input-text" required>
                    </div>
                    <div class="ranking-row">
                        <span class="ranking-badge">3位</span>
                        <input type="text" id="q5_3" class="input-text" required>
                    </div>
                </div>
            </div>

            <!-- Q6. 共通点 -->
            <div class="question-card">
                <label for="q6" class="question-label">Q6. 自分から見て「二人の一番似ているところ（共通点）」はどこだと思いますか？</label>
                <input type="text" id="q6" class="input-text" required>
            </div>

            <!-- Q7. 尊敬できるところ -->
            <div class="question-card">
                <label for="q7" class="question-label">Q7. <span class="target-partner">偲桜</span>さんの「こういうところが本当に素敵で、尊敬できる！」と思う部分を教えてください。</label>
                <input type="text" id="q7" class="input-text" required>
            </div>

            <!-- Q8. 微笑ましい癖 -->
            <div class="question-card">
                <label for="q8" class="question-label">Q8. <span class="target-partner">偲桜</span>さんの「直さなくてもいいけれど、実はちょっと面白いな・可愛らしいな」と思っている癖や習慣はありますか?</label>
                <input type="text" id="q8" class="input-text" required>
            </div>

            <!-- Q9. プロポーズの思い出 -->
            <div class="question-card">
                <label for="q9" class="question-label">Q9. プロポーズのシチュエーションや、その時の率直な感想・裏話などを教えてください。</label>
                <textarea id="q9" class="input-text" required></textarea>
            </div>

            <!-- Q10. 相手へのメッセージ -->
            <div class="question-card">
                <label for="q10" class="question-label">Q10. 普段は照れくさくてなかなか言葉にできない、<span class="target-partner">偲桜</span>さんへのメッセージを教えてください。</label>
                <textarea id="q10" class="input-text" required></textarea>
            </div>

            <!-- Q11. 好きなところベスト3 -->
            <div class="question-card">
                <label class="question-label">Q11. <span class="target-partner">偲桜</span>さんの「好きなところ」ベスト3を教えてください。</label>
                <div class="ranking-inputs">
                    <div class="ranking-row">
                        <span class="ranking-badge">1位</span>
                        <input type="text" id="q11_1" class="input-text" required>
                    </div>
                    <div class="ranking-row">
                        <span class="ranking-badge">2位</span>
                        <input type="text" id="q11_2" class="input-text" required>
                    </div>
                    <div class="ranking-row">
                        <span class="ranking-badge">3位</span>
                        <input type="text" id="q11_3" class="input-text" required>
                    </div>
                </div>
            </div>

            <!-- Q12. よく行くスポット -->
            <div class="question-card">
                <label for="q12" class="question-label">Q12. お二人が一番よく行くお気に入りのデートスポットや、よく一緒に行くお店はどこですか？</label>
                <input type="text" id="q12" class="input-text" required>
            </div>

            <!-- Q13. 天才かと思った瞬間 -->
            <div class="question-card">
                <label for="q13" class="question-label">Q13. <span class="target-partner">偲桜</span>さんを「天才か！」「すごい！」と思った瞬間はどんな時ですか？</label>
                <input type="text" id="q13" class="input-text" required>
            </div>

            <!-- Q14. マイブーム -->
            <div class="question-card">
                <label for="q14" class="question-label">Q14. お二人の「マイブーム」（二人でハマっていることや、よく一緒にしていること）は何ですか？</label>
                <input type="text" id="q14" class="input-text" required>
            </div>

            <!-- Q15. 動物に例えると -->
            <div class="question-card">
                <label for="q15" class="question-label">Q15. <span class="target-partner">偲桜</span>さんを「動物」に例えると何ですか？またその理由も教えてください。</label>
                <input type="text" id="q15" class="input-text" required>
            </div>

            <!-- Q16. お気に入り写真ベスト3 -->
            <div class="question-card">
                <label class="question-label">Q16. <span class="target-partner">偲桜</span>さんが写っている「お気に入り写真」を3枚アップロードしてください。</label>
                <div class="ranking-inputs" style="gap: 1.5rem;">
                    <div>
                        <span style="font-size: 0.85rem; font-weight: bold; display: block; margin-bottom: 0.3rem;">1位の写真</span>
                        <input type="file" id="photo1" name="photo1" accept="image/*" class="input-text" style="border: none; padding: 0.3rem 0;">
                        <img id="preview-photo1" style="max-width: 150px; border-radius: 4px; display: none; margin-top: 0.5rem; border: 1px solid var(--border-color);">
                    </div>
                    <div>
                        <span style="font-size: 0.85rem; font-weight: bold; display: block; margin-bottom: 0.3rem;">2位の写真</span>
                        <input type="file" id="photo2" name="photo2" accept="image/*" class="input-text" style="border: none; padding: 0.3rem 0;">
                        <img id="preview-photo2" style="max-width: 150px; border-radius: 4px; display: none; margin-top: 0.5rem; border: 1px solid var(--border-color);">
                    </div>
                    <div>
                        <span style="font-size: 0.85rem; font-weight: bold; display: block; margin-bottom: 0.3rem;">3位の写真</span>
                        <input type="file" id="photo3" name="photo3" accept="image/*" class="input-text" style="border: none; padding: 0.3rem 0;">
                        <img id="preview-photo3" style="max-width: 150px; border-radius: 4px; display: none; margin-top: 0.5rem; border: 1px solid var(--border-color);">
                    </div>
                </div>
            </div>

            <!-- ボタンエリア -->
            <div style="margin: 2.5rem 0; display: flex; justify-content: flex-end; gap: 0.8rem;">
                <button type="button" class="btn-submit" id="btn-save-draft" style="background-color: #5f6368;">一時保存する</button>
                <button type="submit" class="btn-submit" id="btn-submit">テストデータを送信する</button>
            </div>
        </form>

        <!-- 送信完了カード -->
        <main class="success-card" id="success-card" style="display: none;">
            <div class="success-icon">✓</div>
            <h2 class="success-title">テストデータ送信完了！</h2>
            <p class="success-body" id="success-message-text">
                テスト回答が送信されました。
            </p>
            <div style="margin-top: 1.5rem; display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap;">
                <button class="btn-submit" style="background:#5f6368;" onclick="window.location.reload();">もう一方のテストも行う</button>
                <a href="results.html" class="btn-submit" style="display:inline-flex; text-decoration:none; background:#3f51b5; align-items:center;">結果確認画面へ</a>
            </div>
        </main>
    </div>

    <script>
        const form = document.getElementById('survey-form');
        const successCard = document.getElementById('success-card');
        const submitBtn = document.getElementById('btn-submit');
        const draftBtn = document.getElementById('btn-save-draft');
        const statusText = document.getElementById('save-status-text');
        const statusIcon = document.getElementById('save-status-icon');
        const partnerSpans = document.querySelectorAll('.target-partner');
        const groomRadio = document.getElementById('role-groom-radio');
        const brideRadio = document.getElementById('role-bride-radio');
        const groomBtn = document.getElementById('role-groom-btn');
        const brideBtn = document.getElementById('role-bride-btn');

        // 各入力要素のリスト
        const fields = [
            'q1', 'q2', 'q3', 'q4', 'q5_1', 'q5_2', 'q5_3', 'q6', 'q7', 'q8', 'q9', 'q10', 
            'q11_1', 'q11_2', 'q11_3', 'q12', 'q13', 'q14', 'q15'
        ];

        let selectedRole = 'nayuta_groom';

        function getDraftKey() {
            return `wedding_survey_draft_${selectedRole}`;
        }

        // ロール選択の変更と下書き復元
        function updateRoleSelection(role) {
            selectedRole = role;
            
            // ターゲット名の更新
            if (role === 'nayuta_groom') {
                partnerSpans.forEach(s => s.textContent = '偲桜');
                groomBtn.style.borderColor = 'var(--gold)';
                groomBtn.style.background = 'rgba(212, 175, 55, 0.1)';
                groomBtn.style.color = '#b45309';
                
                brideBtn.style.borderColor = 'var(--border-color)';
                brideBtn.style.background = 'transparent';
                brideBtn.style.color = 'var(--text-primary)';
            } else {
                partnerSpans.forEach(s => s.textContent = '魁');
                brideBtn.style.borderColor = 'var(--rose)';
                brideBtn.style.background = 'rgba(233, 30, 99, 0.1)';
                brideBtn.style.color = '#c2185b';
                
                groomBtn.style.borderColor = 'var(--border-color)';
                groomBtn.style.background = 'transparent';
                groomBtn.style.color = 'var(--text-primary)';
            }

            // フォームを一度クリアして、選択されたロールの下書きを復元
            fields.forEach(fieldId => {
                const el = document.getElementById(fieldId);
                if (el) el.value = '';
            });

            // プレビュー画像もクリア
            for (let i = 1; i <= 3; i++) {
                const previewImg = document.getElementById('preview-photo' + i);
                const fileInput = document.getElementById('photo' + i);
                if (previewImg) previewImg.style.display = 'none';
                if (fileInput) fileInput.value = '';
            }

            const savedDraft = localStorage.getItem(getDraftKey());
            if (savedDraft) {
                try {
                    const data = JSON.parse(savedDraft);
                    fields.forEach(fieldId => {
                        const el = document.getElementById(fieldId);
                        if (el && data[fieldId] !== undefined) {
                            el.value = data[fieldId];
                        }
                    });
                } catch (e) {
                    console.error("Draft restore error: ", e);
                }
            }
        }

        groomBtn.addEventListener('click', () => {
            groomRadio.checked = true;
            updateRoleSelection('nayuta_groom');
        });

        brideBtn.addEventListener('click', () => {
            brideRadio.checked = true;
            updateRoleSelection('nayuta_bride');
        });

        // 初期ロード時
        window.addEventListener('DOMContentLoaded', () => {
            updateRoleSelection('nayuta_groom');
            
            // 写真選択時のプレビュー処理
            for (let i = 1; i <= 3; i++) {
                const photoInput = document.getElementById('photo' + i);
                const previewImg = document.getElementById('preview-photo' + i);
                if (photoInput && previewImg) {
                    photoInput.addEventListener('change', (e) => {
                        const file = e.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = (e) => {
                                previewImg.src = e.target.result;
                                previewImg.style.display = 'block';
                            };
                            reader.readAsDataURL(file);
                        } else {
                            previewImg.src = '';
                            previewImg.style.display = 'none';
                        }
                    });
                }
            }
        });

        // 回答オブジェクトの取得
        function getAnswersObject() {
            return {
                q1: document.getElementById('q1').value.trim(),
                q2: document.getElementById('q2').value.trim(),
                q3: document.getElementById('q3').value.trim(),
                q4: document.getElementById('q4').value.trim(),
                q5: {
                    1: document.getElementById('q5_1').value.trim(),
                    2: document.getElementById('q5_2').value.trim(),
                    3: document.getElementById('q5_3').value.trim()
                },
                q6: document.getElementById('q6').value.trim(),
                q7: document.getElementById('q7').value.trim(),
                q8: document.getElementById('q8').value.trim(),
                q9: document.getElementById('q9').value.trim(),
                q10: document.getElementById('q10').value.trim(),
                q11: {
                    1: document.getElementById('q11_1').value.trim(),
                    2: document.getElementById('q11_2').value.trim(),
                    3: document.getElementById('q11_3').value.trim()
                },
                q12: document.getElementById('q12').value.trim(),
                q13: document.getElementById('q13').value.trim(),
                q14: document.getElementById('q14').value.trim(),
                q15: document.getElementById('q15').value.trim()
            };
        }

        // サーバーへの送信関数 (draft または submitted)
        async function sendToServer(status = 'draft') {
            const answers = getAnswersObject();
            
            // ローカルストレージに下書き保存
            const localData = {};
            fields.forEach(fieldId => {
                const el = document.getElementById(fieldId);
                if (el) localData[fieldId] = el.value;
            });
            localStorage.setItem(getDraftKey(), JSON.stringify(localData));

            const formData = new FormData();
            formData.append('status', status);
            formData.append('answers', JSON.stringify(answers));

            // 画像の添付
            for (let i = 1; i <= 3; i++) {
                const photoInput = document.getElementById('photo' + i);
                if (photoInput && photoInput.files[0]) {
                    formData.append('photo' + i, photoInput.files[0]);
                }
            }

            const response = await fetch(`api.php?action=save&role=${selectedRole}`, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                throw new Error('HTTPエラー');
            }

            return await response.json();
        }

        // 入力時のオートセーブ (ローカル & サーバーへのサイレント送信)
        let saveTimeout = null;
        form.addEventListener('input', () => {
            statusText.textContent = "一時保存中...";
            statusIcon.textContent = "●";
            statusIcon.style.color = "var(--accent-color)";

            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                try {
                    // 入力内容をローカルストレージへ即時反映
                    const localData = {};
                    fields.forEach(fieldId => {
                        const el = document.getElementById(fieldId);
                        if (el) localData[fieldId] = el.value;
                    });
                    localStorage.setItem(getDraftKey(), JSON.stringify(localData));

                    // サーバーへサイレント下書き保存 (画像は送らない)
                    const answers = getAnswersObject();
                    const formData = new FormData();
                    formData.append('status', 'draft');
                    formData.append('answers', JSON.stringify(answers));
                    
                    await fetch(`api.php?action=save&role=${selectedRole}`, {
                        method: 'POST',
                        body: formData
                    });

                    statusText.textContent = "下書きは自動保存されています";
                    statusIcon.textContent = "✓";
                    statusIcon.style.color = "green";
                } catch (e) {
                    console.error("Auto save failed:", e);
                    statusText.textContent = "下書き自動保存失敗（オフライン）";
                    statusIcon.textContent = "⚠️";
                    statusIcon.style.color = "orange";
                }
            }, 2000);
        });

        // 「一時保存する」ボタンクリック時の処理 (手動一時保存)
        draftBtn.addEventListener('click', async () => {
            draftBtn.disabled = true;
            const originalText = draftBtn.textContent;
            draftBtn.textContent = '一時保存中...';
            
            try {
                const res = await sendToServer('draft');
                if (res.status === 'success') {
                    alert('下書きを一時保存しました。管理者の確認画面に同期されました。');
                    statusText.textContent = "下書きは自動保存されています";
                    statusIcon.textContent = "✓";
                    statusIcon.style.color = "green";
                } else {
                    alert('一時保存エラー: ' + res.message);
                }
            } catch (err) {
                console.error(err);
                alert('通信に失敗しました。');
            } finally {
                draftBtn.disabled = false;
                draftBtn.textContent = originalText;
            }
        });

        // 送信ボタンクリック時の処理
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.textContent = '送信中...';
            draftBtn.disabled = true;

            try {
                const result = await sendToServer('submitted');

                if (result.status === 'success') {
                    localStorage.removeItem(getDraftKey());
                    form.style.display = 'none';
                    successCard.style.display = 'block';
                    
                    const roleText = selectedRole === 'nayuta_groom' ? '新郎役（テスト）' : '新婦役（テスト）';
                    document.getElementById('success-message-text').innerHTML = `
                        テスト回答が「${roleText}」として送信されました。<br>
                        結果確認画面で正しく反映されているか確認してください。
                    `;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    alert('送信エラー: ' + result.message);
                    submitBtn.disabled = false;
                    submitBtn.textContent = '送信する';
                    draftBtn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                alert('通信に失敗しました。もう一度お試しください。');
                submitBtn.disabled = false;
                submitBtn.textContent = '送信する';
                draftBtn.disabled = false;
            }
        });
    </script>
</body>
</html>

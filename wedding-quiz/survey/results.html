<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アンケート結果確認 | WEDDING QUIZ</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 4px;
            margin-top: 0.3rem;
            text-align: center;
        }
        .status-badge.submitted {
            background-color: #e6f4ea;
            color: #137333;
            border: 1px solid #137333;
        }
        .status-badge.draft {
            background-color: #e8f0fe;
            color: #1a73e8;
            border: 1px solid #1a73e8;
        }
        .status-badge.none {
            background-color: #fce8e6;
            color: #c5221f;
            border: 1px solid #c5221f;
        }
        .photo-result-container {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-top: 0.5rem;
        }
        .photo-result-item {
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0.5rem;
            background: #f8f9fa;
        }
        .photo-result-item img {
            max-width: 100%;
            height: auto;
            border-radius: 2px;
            display: block;
            margin-top: 0.3rem;
            max-height: 250px;
            object-fit: contain;
        }
        .photo-result-title {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--text-secondary);
        }
        .btn-backup {
            background-color: #34a853 !important;
            color: #ffffff !important;
        }
        .btn-backup:hover {
            background-color: #2b8c44 !important;
        }
    </style>
</head>
<body class="theme-nayuta">
    <div class="container-wide" id="results-app">
        <!-- ヘッダー -->
        <header class="form-header-card" style="margin-bottom: 1.5rem;">
            <div class="logo-text">SURVEY RESULTS</div>
            <div class="sub-title">新郎新婦 事前アンケート回答結果一覧</div>
        </header>

        <!-- 管理コントロール（テストデータ表示切替・バックアップなど） -->
        <div class="question-card" style="margin-bottom: 1.5rem; border-top: 3px solid var(--accent-color);">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; border-bottom: 1px solid #f1f3f4; padding-bottom: 1rem; margin-bottom: 1rem;">
                <div>
                    <h3 style="font-size: 1.05rem; font-weight: 700;">データ表示設定</h3>
                    <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.1rem;">
                        本物の新郎新婦の回答と、テスト用回答（那由他さん入力）の表示を切り替えます。
                    </p>
                </div>
                <div style="display: flex; gap: 0.8rem;">
                    <button class="btn-submit" id="btn-show-real" style="margin-top: 0; padding: 0.5rem 1.2rem; font-size: 0.85rem;">
                        本番データのみ表示
                    </button>
                    <button class="btn-submit" id="btn-show-test" style="margin-top: 0; padding: 0.5rem 1.2rem; font-size: 0.85rem; background: #5f6368;">
                        テストデータも含めて表示 (3列)
                    </button>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem;">
                <div>
                    <h3 style="font-size: 1.05rem; font-weight: 700;">データのバックアップ</h3>
                    <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.1rem;">
                        集まった回答内容をテキストまたはJSON形式で那由他さんのPCに保存します。
                    </p>
                </div>
                <div style="display: flex; gap: 0.8rem;">
                    <button class="btn-submit btn-backup" id="btn-download-txt" style="margin-top: 0; padding: 0.5rem 1.2rem; font-size: 0.85rem;">
                        📄 テキスト形式でダウンロード
                    </button>
                    <button class="btn-submit btn-backup" id="btn-download-json" style="margin-top: 0; padding: 0.5rem 1.2rem; font-size: 0.85rem; background-color: #4285f4 !important;">
                        💾 JSON形式でダウンロード
                    </button>
                </div>
            </div>
        </div>

        <!-- 結果一覧表示（JSで動的生成） -->
        <div id="results-container">
            <div style="text-align: center; padding: 3rem;" id="loading-el">
                <p style="color: var(--text-secondary);">アンケート回答結果をロードしています...</p>
            </div>
        </div>

        <!-- データのクリアセクション (テストリセット用) -->
        <div class="reset-section">
            <h4 style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.8rem;">テストデータおよび回答データの削除</h4>
            <div style="display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap;">
                <button class="btn-small-danger" onclick="clearData('nayuta_groom')">新郎テストをクリア</button>
                <button class="btn-small-danger" onclick="clearData('nayuta_bride')">新婦テストをクリア</button>
                <button class="btn-small-danger" style="color: #c62828; border-color: #c62828;" onclick="clearData('groom')">本番新郎データをクリア</button>
                <button class="btn-small-danger" style="color: #c62828; border-color: #c62828;" onclick="clearData('bride')">本番新婦データをクリア</button>
            </div>
        </div>
    </div>

    <script>
        let serverData = null;
        let showTestMode = false;

        const QUIZ_QUESTIONS = [
            { id: 'q1', title: 'Q1. お互いの呼び名と、その由来', isRanking: false, isPhoto: false },
            { id: 'q2', title: 'Q2. 初めて会った時の「第一印象」', isRanking: false, isPhoto: false },
            { id: 'q3', title: 'Q3. 初めてデートした「思い出の場所」', isRanking: false, isPhoto: false },
            { id: 'q4', title: 'Q4. 作ってくれた料理（用意してくれた食事）で「一番美味しかったもの」', isRanking: false, isPhoto: false },
            { id: 'q5', title: 'Q5. 相手から貰ったプレゼントで、嬉しかったものランキング', isRanking: true, isPhoto: false },
            { id: 'q6', title: 'Q6. 魁さん・偲桜さんから見て「二人の一番似ているところ（共通点）」', isRanking: false, isPhoto: false },
            { id: 'q7', title: 'Q7. 相手の「こういうところが本当に素敵で、尊敬できる！」と思う部分', isRanking: false, isPhoto: false },
            { id: 'q8', title: 'Q8. 相手の「直さなくてもいいけれど、実はちょっと面白いな・可愛らしいな」と思う癖や習慣', isRanking: false, isPhoto: false },
            { id: 'q9', title: 'Q9. プロポーズのシチュエーションやその時の感想・裏話', isRanking: false, isPhoto: false },
            { id: 'q10', title: 'Q10. 照れくさくて普段言えない、相手へのメッセージ', isRanking: false, isPhoto: false },
            { id: 'q11', title: 'Q11. 相手の「好きなところ」ベスト3', isRanking: true, isPhoto: false },
            { id: 'q12', title: 'Q12. 一番よく行くお気に入りのデートスポットや、よく一緒に行くお店', isRanking: false, isPhoto: false },
            { id: 'q13', title: 'Q13. 相手を「天才か！」「すごい！」と思った瞬間', isRanking: false, isPhoto: false },
            { id: 'q14', title: 'Q14. お二人の「マイブーム」（二人でハマっていることや、よく一緒にしていること）', isRanking: false, isPhoto: false },
            { id: 'q15', title: 'Q15. 相手を「動物」に例えると何ですか？またその理由', isRanking: false, isPhoto: false },
            { id: 'photo', title: 'Q16. 相手が写っているお気に入り写真ベスト3', isRanking: false, isPhoto: true }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            loadResults();

            document.getElementById('btn-show-real').addEventListener('click', () => {
                showTestMode = false;
                toggleViewButtons();
                renderResults();
            });

            document.getElementById('btn-show-test').addEventListener('click', () => {
                showTestMode = true;
                toggleViewButtons();
                renderResults();
            });

            // バックアップダウンロードイベント
            document.getElementById('btn-download-json').addEventListener('click', downloadJSON);
            document.getElementById('btn-download-txt').addEventListener('click', downloadTXT);
        });

        function toggleViewButtons() {
            const btnReal = document.getElementById('btn-show-real');
            const btnTest = document.getElementById('btn-show-test');
            
            if (showTestMode) {
                btnTest.style.backgroundColor = 'var(--accent-color)';
                btnReal.style.backgroundColor = '#5f6368';
            } else {
                btnReal.style.backgroundColor = 'var(--accent-color)';
                btnTest.style.backgroundColor = '#5f6368';
            }
        }

        async function loadResults() {
            try {
                const response = await fetch('api.php?action=get&t=' + Date.now());
                const result = await response.json();
                if (result.status === 'success') {
                    serverData = result.results;
                    renderResults();
                } else {
                    document.getElementById('loading-el').innerHTML = `<p style="color: #d32f2f;">データの読み込みに失敗しました: ${result.message}</p>`;
                }
            } catch (err) {
                console.error(err);
                document.getElementById('loading-el').innerHTML = `<p style="color: #d32f2f;">通信エラーが発生しました。</p>`;
            }
        }

        // ステータスバッジの描画
        function getStatusBadgeHtml(data) {
            if (!data) {
                return `<div class="status-badge none">未回答</div>`;
            }
            if (data.status === 'submitted') {
                return `<div class="status-badge submitted">送信完了</div>`;
            }
            return `<div class="status-badge draft">一時保存中 (下書き)</div>`;
        }

        function renderResults() {
            if (!serverData) return;

            const container = document.getElementById('results-container');
            container.innerHTML = '';

            const hasGroom = !!serverData.groom;
            const hasBride = !!serverData.bride;
            const hasTestGroom = !!serverData.nayuta_groom;
            const hasTestBride = !!serverData.nayuta_bride;

            // テスト表示モードの自動選択
            if (!showTestMode && (hasTestGroom || hasTestBride) && !hasGroom && !hasBride) {
                showTestMode = true;
                toggleViewButtons();
            }

            QUIZ_QUESTIONS.forEach(question => {
                const section = document.createElement('section');
                section.className = 'question-card';
                section.style.borderTop = '3px solid var(--border-color)';
                
                const title = document.createElement('h3');
                title.style.fontSize = '1.05rem';
                title.style.marginBottom = '1.2rem';
                title.style.color = 'var(--text-primary)';
                title.style.borderBottom = '1px solid #f1f3f4';
                title.style.paddingBottom = '0.5rem';
                title.textContent = question.title;
                section.appendChild(title);

                const grid = document.createElement('div');
                grid.className = showTestMode ? 'results-grid three-cols' : 'results-grid';

                // 1. 新郎 (魁さん) の回答
                const colGroom = document.createElement('div');
                colGroom.className = 'role-column';
                
                let groomHeaderHtml = `<div class="role-header groom">🤵 新郎・魁さん`;
                groomHeaderHtml += getStatusBadgeHtml(serverData.groom);
                groomHeaderHtml += `</div>`;
                colGroom.innerHTML = groomHeaderHtml;

                const ansGroomCard = document.createElement('div');
                ansGroomCard.className = 'answer-card';
                ansGroomCard.style.borderLeft = '3px solid #1a73e8';
                
                if (hasGroom) {
                    if (question.isPhoto) {
                        renderPhotoContent(ansGroomCard, serverData.groom.photos);
                    } else {
                        renderAnswerContent(ansGroomCard, serverData.groom.answers[question.id], question.isRanking);
                    }
                    colGroom.innerHTML += `<div class="meta-status">最終更新: ${serverData.groom.updated_at}</div>`;
                } else {
                    ansGroomCard.innerHTML = `<p style="color: var(--text-secondary); font-style: italic; text-align: center; font-size: 0.85rem;">データなし</p>`;
                }
                colGroom.insertBefore(ansGroomCard, colGroom.firstChild.nextSibling);
                grid.appendChild(colGroom);

                // 2. 新婦 (偲桜さん) の回答
                const colBride = document.createElement('div');
                colBride.className = 'role-column';

                let brideHeaderHtml = `<div class="role-header bride">👰 新婦・偲桜さん`;
                brideHeaderHtml += getStatusBadgeHtml(serverData.bride);
                brideHeaderHtml += `</div>`;
                colBride.innerHTML = brideHeaderHtml;

                const ansBrideCard = document.createElement('div');
                ansBrideCard.className = 'answer-card';
                ansBrideCard.style.borderLeft = '3px solid #e91e63';
                
                if (hasBride) {
                    if (question.isPhoto) {
                        renderPhotoContent(ansBrideCard, serverData.bride.photos);
                    } else {
                        renderAnswerContent(ansBrideCard, serverData.bride.answers[question.id], question.isRanking);
                    }
                    colBride.innerHTML += `<div class="meta-status">最終更新: ${serverData.bride.updated_at}</div>`;
                } else {
                    ansBrideCard.innerHTML = `<p style="color: var(--text-secondary); font-style: italic; text-align: center; font-size: 0.85rem;">データなし</p>`;
                }
                colBride.insertBefore(ansBrideCard, colBride.firstChild.nextSibling);
                grid.appendChild(colBride);

                // 3. テストデータ
                if (showTestMode) {
                    const colTest = document.createElement('div');
                    colTest.className = 'role-column';
                    
                    let testHeaderHtml = `<div class="role-header nayuta">👤 テスト回答 (那由他さん)`;
                    let statusLabel = '';
                    if (hasTestGroom) statusLabel += `新郎:${serverData.nayuta_groom.status === 'submitted' ? '送信済' : '下書き'} `;
                    if (hasTestBride) statusLabel += `新婦:${serverData.nayuta_bride.status === 'submitted' ? '送信済' : '下書き'}`;
                    if (!hasTestGroom && !hasTestBride) statusLabel = '未回答';
                    
                    testHeaderHtml += `<div class="status-badge ${hasTestGroom || hasTestBride ? 'draft' : 'none'}" style="font-size:0.7rem; font-weight:normal;">${statusLabel}</div>`;
                    testHeaderHtml += `</div>`;
                    colTest.innerHTML = testHeaderHtml;
                    
                    const ansTestCard = document.createElement('div');
                    ansTestCard.className = 'answer-card';
                    ansTestCard.style.borderLeft = '3px solid #3f51b5';

                    let testHtml = '';
                    if (hasTestGroom) {
                        testHtml += `<h5 style="color: #1557b0; font-size: 0.8rem; margin-bottom: 0.3rem;">新郎役としてテスト入力:</h5>`;
                        const tempDiv = document.createElement('div');
                        if (question.isPhoto) {
                            renderPhotoContent(tempDiv, serverData.nayuta_groom.photos);
                        } else {
                            renderAnswerContent(tempDiv, serverData.nayuta_groom.answers[question.id], question.isRanking);
                        }
                        testHtml += tempDiv.innerHTML;
                    }
                    if (hasTestBride) {
                        if (hasTestGroom) testHtml += `<hr style="margin: 0.8rem 0; border: none; border-top: 1px dashed var(--border-color);">`;
                        testHtml += `<h5 style="color: #c2185b; font-size: 0.8rem; margin-bottom: 0.3rem;">新婦役としてテスト入力:</h5>`;
                        const tempDiv = document.createElement('div');
                        if (question.isPhoto) {
                            renderPhotoContent(tempDiv, serverData.nayuta_bride.photos);
                        } else {
                            renderAnswerContent(tempDiv, serverData.nayuta_bride.answers[question.id], question.isRanking);
                        }
                        testHtml += tempDiv.innerHTML;
                    }
                    
                    if (!hasTestGroom && !hasTestBride) {
                        ansTestCard.innerHTML = `<p style="color: var(--text-secondary); font-style: italic; text-align: center; font-size: 0.85rem;">未入力</p>`;
                    } else {
                        ansTestCard.innerHTML = testHtml;
                    }
                    colTest.appendChild(ansTestCard);
                    grid.appendChild(colTest);
                }

                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        // 回答テキストコンテンツの描画
        function renderAnswerContent(element, data, isRanking) {
            if (!data) {
                element.innerHTML = `<p style="color: var(--text-secondary); font-style: italic; text-align: center; font-size: 0.85rem;">未入力</p>`;
                return;
            }

            if (isRanking) {
                element.innerHTML = `
                    <div class="ranking-list">
                        <div class="ranking-item"><span style="color:#b45309; font-weight:700; font-size:0.85rem;">1位:</span> <span style="font-size:0.9rem;">${escapeHtml(data[1])}</span></div>
                        <div class="ranking-item"><span style="color:#4b5563; font-weight:700; font-size:0.85rem;">2位:</span> <span style="font-size:0.9rem;">${escapeHtml(data[2])}</span></div>
                        <div class="ranking-item"><span style="color:#c2410c; font-weight:700; font-size:0.85rem;">3位:</span> <span style="font-size:0.9rem;">${escapeHtml(data[3])}</span></div>
                    </div>
                `;
            } else {
                element.innerHTML = `<div class="value">${escapeHtml(data)}</div>`;
            }
        }

        // アップロード写真の描画
        function renderPhotoContent(element, photos) {
            if (!photos || (!photos.photo1 && !photos.photo2 && !photos.photo3)) {
                element.innerHTML = `<p style="color: var(--text-secondary); font-style: italic; text-align: center; font-size: 0.85rem;">写真未登録</p>`;
                return;
            }

            let html = `<div class="photo-result-container">`;
            const cacheBuster = Date.now();

            for (let i = 1; i <= 3; i++) {
                const key = 'photo' + i;
                if (photos[key]) {
                    const imgUrl = `../${photos[key]}?t=${cacheBuster}`;
                    html += `
                        <div class="photo-result-item">
                            <div class="photo-result-title">${i}位の写真</div>
                            <img src="${imgUrl}" alt="${i}位の写真" onerror="this.style.display='none'; this.after('読み込み失敗');">
                        </div>
                    `;
                } else {
                    html += `
                        <div class="photo-result-item" style="border-style: dashed;">
                            <div class="photo-result-title">${i}位の写真: <span style="font-weight:normal; font-style:italic;">未登録</span></div>
                        </div>
                    `;
                }
            }
            html += `</div>`;
            element.innerHTML = html;
        }

        // HTMLエスケープ
        function escapeHtml(str) {
            if (typeof str !== 'string') return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // バックアップJSONダウンロード
        function downloadJSON() {
            if (!serverData) return;
            const dataStr = JSON.stringify(serverData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const timestamp = getFormattedTimestamp();
            const a = document.createElement('a');
            a.href = url;
            a.download = `wedding_survey_backup_${timestamp}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // バックアップ可読テキストダウンロード (TXT)
        function downloadTXT() {
            if (!serverData) return;
            
            let text = "==================================================\n";
            text += "魁さん＆偲桜さん 結婚式二次会事前アンケート回答結果\n";
            text += `出力日時: ${new Date().toLocaleString()}\n`;
            text += "==================================================\n\n";

            QUIZ_QUESTIONS.forEach(question => {
                if (question.isPhoto) return; // 画像情報はスキップ

                text += `■ ${question.title}\n`;
                text += `--------------------------------------------------\n`;
                
                // 新郎
                text += `【新郎・魁さんの回答】\n`;
                if (serverData.groom && serverData.groom.answers[question.id]) {
                    const ans = serverData.groom.answers[question.id];
                    if (question.isRanking) {
                        text += `  1位: ${ans[1]}\n  2位: ${ans[2]}\n  3位: ${ans[3]}\n`;
                    } else {
                        text += `  ${ans}\n`;
                    }
                } else {
                    text += "  (未回答)\n";
                }
                text += "\n";

                // 新婦
                text += `【新婦・偲桜さんの回答】\n`;
                if (serverData.bride && serverData.bride.answers[question.id]) {
                    const ans = serverData.bride.answers[question.id];
                    if (question.isRanking) {
                        text += `  1位: ${ans[1]}\n  2位: ${ans[2]}\n  3位: ${ans[3]}\n`;
                    } else {
                        text += `  ${ans}\n`;
                    }
                } else {
                    text += "  (未回答)\n";
                }
                
                text += "\n==================================================\n\n";
            });

            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const timestamp = getFormattedTimestamp();
            const a = document.createElement('a');
            a.href = url;
            a.download = `wedding_survey_answers_${timestamp}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // タイムスタンプ取得 (YYYYMMDD_HHMMSS)
        function getFormattedTimestamp() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const h = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            return `${y}${m}${d}_${h}${min}${s}`;
        }

        // データ削除
        async function clearData(target) {
            if (confirm(`${target} のアンケートデータおよびアップロード画像をサーバーから完全に削除しますか？`)) {
                try {
                    const response = await fetch(`api.php?action=clear&target=${target}`, {
                        method: 'POST'
                    });
                    const result = await response.json();
                    if (result.status === 'success') {
                        alert(result.message);
                        loadResults();
                    } else {
                        alert('削除エラー: ' + result.message);
                    }
                } catch (err) {
                    console.error(err);
                    alert('通信に失敗しました。');
                }
            }
        }
    </script>
</body>
</html>

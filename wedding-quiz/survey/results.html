<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アンケート結果確認 | WEDDING QUIZ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-groom"> <!-- デフォルトのカラーテーマ -->
    <div class="container-wide" id="results-app">
        <!-- ヘッダー -->
        <header>
            <div class="logo-text">SURVEY RESULTS</div>
            <div class="sub-title">新郎新婦 事前アンケート回答結果一覧</div>
        </header>

        <!-- 管理コントロール（テストデータ表示切替など） -->
        <div class="glass-card" style="margin-bottom: 2rem; padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div>
                <h3 style="font-size: 1.1rem; font-weight: 700; color: var(--gold-light);">データ表示設定</h3>
                <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.2rem;">
                    本物の新郎新婦の回答と、テスト用回答（那由他さん入力）の表示を切り替えます。
                </p>
            </div>
            <div style="display: flex; gap: 1rem;">
                <button class="btn" id="btn-show-real" style="margin-top: 0; padding: 0.6rem 1.5rem; width: auto; background: var(--border-gold); color: #000; font-size: 0.9rem;">
                    本番データのみ表示
                </button>
                <button class="btn" id="btn-show-test" style="margin-top: 0; padding: 0.6rem 1.5rem; width: auto; background: rgba(255,255,255,0.05); color: #fff; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.15);">
                    テストデータも含めて表示 (3列)
                </button>
            </div>
        </div>

        <!-- 結果一覧表示（JSで動的生成） -->
        <div id="results-container">
            <!-- ここに質問ごとの対比カードが追加される -->
            <div style="text-align: center; padding: 3rem;" id="loading-el">
                <p style="color: var(--text-secondary);">アンケート回答結果をロードしています...</p>
            </div>
        </div>

        <!-- データのクリアセクション (テストリセット用) -->
        <div class="reset-section">
            <h4 style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1rem;">テストデータの削除</h4>
            <div style="display: flex; justify-content: center; gap: 1rem;">
                <button class="btn-small-danger" onclick="clearData('nayuta_groom')">新郎テストデータをクリア</button>
                <button class="btn-small-danger" onclick="clearData('nayuta_bride')">新婦テストデータをクリア</button>
                <button class="btn-small-danger" style="background: rgba(244,67,54,0.1); border-color: rgba(244,67,54,0.3); color: #ff8a80;" onclick="clearData('groom')">本番新郎データをクリア</button>
                <button class="btn-small-danger" style="background: rgba(244,67,54,0.1); border-color: rgba(244,67,54,0.3); color: #ff8a80;" onclick="clearData('bride')">本番新婦データをクリア</button>
            </div>
        </div>
    </div>

    <script>
        let serverData = null;
        let showTestMode = false;

        const QUIZ_QUESTIONS = [
            {
                id: 'q1',
                title: 'Q1. 貰って嬉しかったプレゼントランキング',
                isRanking: true
            },
            {
                id: 'q2',
                title: 'Q2. お互いに初めて会った時の「第一印象」',
                isRanking: false
            },
            {
                id: 'q3',
                title: 'Q3. 「実はここだけは直してほしい」と思っていること',
                isRanking: false
            },
            {
                id: 'q4',
                title: 'Q4. 相手の「こういうところが一番尊敬できる」と思う部分',
                isRanking: false
            },
            {
                id: 'q5',
                title: 'Q5. お二人が初めてデートした「思い出の場所」',
                isRanking: false
            },
            {
                id: 'q6',
                title: 'Q6. 相手に実はまだ秘密にしていること・未公開エピソード',
                isRanking: false
            }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            loadResults();

            document.getElementById('btn-show-real').addEventListener('click', () => {
                showTestMode = false;
                toggleViewButtons();
                renderResults();
            });

            document.getElementById('btn-show-test').addEventListener('click', () => {
                showTestMode = true;
                toggleViewButtons();
                renderResults();
            });
        });

        function toggleViewButtons() {
            const btnReal = document.getElementById('btn-show-real');
            const btnTest = document.getElementById('btn-show-test');
            
            if (showTestMode) {
                btnTest.style.background = 'linear-gradient(135deg, #9fa8da 0%, #5c6bc0 100%)';
                btnTest.style.color = '#fff';
                btnReal.style.background = 'rgba(255,255,255,0.05)';
                btnReal.style.color = '#fff';
            } else {
                btnReal.style.background = 'var(--border-gold)';
                btnReal.style.color = '#000';
                btnTest.style.background = 'rgba(255,255,255,0.05)';
                btnTest.style.color = '#fff';
            }
        }

        async function loadResults() {
            try {
                const response = await fetch('api.php?action=get&t=' + Date.now());
                const result = await response.json();
                if (result.status === 'success') {
                    serverData = result.results;
                    renderResults();
                } else {
                    document.getElementById('loading-el').innerHTML = `<p style="color: var(--rose);">データの読み込みに失敗しました: ${result.message}</p>`;
                }
            } catch (err) {
                console.error(err);
                document.getElementById('loading-el').innerHTML = `<p style="color: var(--rose);">通信エラーが発生しました。</p>`;
            }
        }

        function renderResults() {
            if (!serverData) return;

            const container = document.getElementById('results-container');
            container.innerHTML = '';

            // 各回答があるかチェック
            const hasGroom = !!serverData.groom;
            const hasBride = !!serverData.bride;
            const hasTestGroom = !!serverData.nayuta_groom;
            const hasTestBride = !!serverData.nayuta_bride;

            // テスト表示モードの自動選択
            if (!showTestMode && (hasTestGroom || hasTestBride) && !hasGroom && !hasBride) {
                showTestMode = true;
                toggleViewButtons();
            }

            QUIZ_QUESTIONS.forEach(question => {
                const section = document.createElement('section');
                section.className = 'glass-card';
                
                const title = document.createElement('h3');
                title.style.fontSize = '1.25rem';
                title.style.marginBottom = '1.5rem';
                title.style.color = 'var(--gold-light)';
                title.style.borderBottom = '1px solid rgba(255,255,255,0.1)';
                title.style.paddingBottom = '0.5rem';
                title.textContent = question.title;
                section.appendChild(title);

                const grid = document.createElement('div');
                grid.className = showTestMode ? 'results-grid three-cols' : 'results-grid';

                // 1. 新郎 (魁さん) の回答
                const colGroom = document.createElement('div');
                colGroom.className = 'role-column';
                colGroom.innerHTML = `<div class="role-header groom">🤵 新郎・魁さん</div>`;
                const ansGroomCard = document.createElement('div');
                ansGroomCard.className = 'answer-card';
                
                if (hasGroom) {
                    renderAnswerContent(ansGroomCard, serverData.groom.answers[question.id], question.isRanking);
                    colGroom.innerHTML += `<div class="meta-status">回答日時: ${serverData.groom.updated_at}</div>`;
                } else {
                    ansGroomCard.innerHTML = `<p style="color: var(--text-secondary); font-style: italic; text-align: center;">未回答</p>`;
                }
                colGroom.insertBefore(ansGroomCard, colGroom.firstChild.nextSibling);
                grid.appendChild(colGroom);

                // 2. 新婦 (偲桜さん) の回答
                const colBride = document.createElement('div');
                colBride.className = 'role-column';
                colBride.innerHTML = `<div class="role-header bride">👰 新婦・偲桜さん</div>`;
                const ansBrideCard = document.createElement('div');
                ansBrideCard.className = 'answer-card';
                
                if (hasBride) {
                    renderAnswerContent(ansBrideCard, serverData.bride.answers[question.id], question.isRanking);
                    colBride.innerHTML += `<div class="meta-status">回答日時: ${serverData.bride.updated_at}</div>`;
                } else {
                    ansBrideCard.innerHTML = `<p style="color: var(--text-secondary); font-style: italic; text-align: center;">未回答</p>`;
                }
                colBride.insertBefore(ansBrideCard, colBride.firstChild.nextSibling);
                grid.appendChild(colBride);

                // 3. テストデータ (那由他さん入力、表示モード時のみ)
                if (showTestMode) {
                    const colTest = document.createElement('div');
                    colTest.className = 'role-column';
                    colTest.innerHTML = `<div class="role-header nayuta">👤 テスト回答 (那由他さん)</div>`;
                    
                    const ansTestCard = document.createElement('div');
                    ansTestCard.className = 'answer-card';

                    // 新郎テストと新婦テストの両方がある場合は並べて表示
                    let testHtml = '';
                    if (hasTestGroom) {
                        testHtml += `<h5 style="color: var(--gold-light); margin-bottom: 0.3rem;">新郎役として入力:</h5>`;
                        const tempDiv = document.createElement('div');
                        renderAnswerContent(tempDiv, serverData.nayuta_groom.answers[question.id], question.isRanking);
                        testHtml += tempDiv.innerHTML;
                    }
                    if (hasTestBride) {
                        if (hasTestGroom) testHtml += `<hr style="margin: 1rem 0; border: none; border-top: 1px dashed rgba(255,255,255,0.1);">`;
                        testHtml += `<h5 style="color: var(--rose-light); margin-bottom: 0.3rem;">新婦役として入力:</h5>`;
                        const tempDiv = document.createElement('div');
                        renderAnswerContent(tempDiv, serverData.nayuta_bride.answers[question.id], question.isRanking);
                        testHtml += tempDiv.innerHTML;
                    }
                    
                    if (!hasTestGroom && !hasTestBride) {
                        ansTestCard.innerHTML = `<p style="color: var(--text-secondary); font-style: italic; text-align: center;">未入力</p>`;
                    } else {
                        ansTestCard.innerHTML = testHtml;
                    }
                    colTest.appendChild(ansTestCard);
                    grid.appendChild(colTest);
                }

                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        // 回答コンテンツの描画ユーティリティ
        function renderAnswerContent(element, data, isRanking) {
            if (!data) {
                element.innerHTML = `<p style="color: var(--text-secondary); font-style: italic; text-align: center;">未回答</p>`;
                return;
            }

            if (isRanking) {
                element.innerHTML = `
                    <div class="ranking-list">
                        <div class="ranking-item"><span style="color:#d4af37; font-weight:700;">1位:</span> <span>${escapeHtml(data[1])}</span></div>
                        <div class="ranking-item"><span style="color:#c0c0c0; font-weight:700;">2位:</span> <span>${escapeHtml(data[2])}</span></div>
                        <div class="ranking-item"><span style="color:#cd7f32; font-weight:700;">3位:</span> <span>${escapeHtml(data[3])}</span></div>
                    </div>
                `;
            } else {
                element.innerHTML = `<div class="value">${escapeHtml(data)}</div>`;
            }
        }

        function escapeHtml(str) {
            if (typeof str !== 'string') return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        async function clearData(target) {
            if (confirm(`${target} のアンケートデータをサーバーから完全に削除しますか？`)) {
                try {
                    const response = await fetch(`api.php?action=clear&target=${target}`, {
                        method: 'POST'
                    });
                    const result = await response.json();
                    if (result.status === 'success') {
                        alert(result.message);
                        loadResults();
                    } else {
                        alert('削除エラー: ' + result.message);
                    }
                } catch (err) {
                    console.error(err);
                    alert('通信に失敗しました。');
                }
            }
        }
    </script>
</body>
</html>

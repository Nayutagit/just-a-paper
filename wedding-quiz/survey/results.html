<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アンケート結果確認 | WEDDING QUIZ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-nayuta"> <!-- ニュートラルなテーマ -->
    <div class="container-wide" id="results-app">
        <!-- ヘッダー -->
        <header class="form-header-card" style="margin-bottom: 1.5rem;">
            <div class="logo-text">SURVEY RESULTS</div>
            <div class="sub-title">新郎新婦 事前アンケート回答結果一覧</div>
        </header>

        <!-- 管理コントロール（テストデータ表示切替など） -->
        <div class="question-card" style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; border-top: 3px solid var(--accent-color);">
            <div>
                <h3 style="font-size: 1.05rem; font-weight: 700;">データ表示設定</h3>
                <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.1rem;">
                    本物の新郎新婦の回答と、テスト用回答（那由他さん入力）の表示を切り替えます。
                </p>
            </div>
            <div style="display: flex; gap: 0.8rem;">
                <button class="btn-submit" id="btn-show-real" style="margin-top: 0; padding: 0.5rem 1.2rem; font-size: 0.85rem;">
                    本番データのみ表示
                </button>
                <button class="btn-submit" id="btn-show-test" style="margin-top: 0; padding: 0.5rem 1.2rem; font-size: 0.85rem; background: #5f6368;">
                    テストデータも含めて表示 (3列)
                </button>
            </div>
        </div>

        <!-- 結果一覧表示（JSで動的生成） -->
        <div id="results-container">
            <div style="text-align: center; padding: 3rem;" id="loading-el">
                <p style="color: var(--text-secondary);">アンケート回答結果をロードしています...</p>
            </div>
        </div>

        <!-- データのクリアセクション (テストリセット用) -->
        <div class="reset-section">
            <h4 style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.8rem;">テストデータおよび回答データの削除</h4>
            <div style="display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap;">
                <button class="btn-small-danger" onclick="clearData('nayuta_groom')">新郎テストをクリア</button>
                <button class="btn-small-danger" onclick="clearData('nayuta_bride')">新婦テストをクリア</button>
                <button class="btn-small-danger" style="color: #c62828; border-color: #c62828;" onclick="clearData('groom')">本番新郎データをクリア</button>
                <button class="btn-small-danger" style="color: #c62828; border-color: #c62828;" onclick="clearData('bride')">本番新婦データをクリア</button>
            </div>
        </div>
    </div>

    <script>
        let serverData = null;
        let showTestMode = false;

        const QUIZ_QUESTIONS = [
            {
                id: 'q1',
                title: 'Q1. お互いの呼び名と、その由来',
                isRanking: false
            },
            {
                id: 'q2',
                title: 'Q2. 初めて会った時の「第一印象」',
                isRanking: false
            },
            {
                id: 'q3',
                title: 'Q3. 【意思疎通チェック】初めてデートした「思い出の場所」',
                isRanking: false
            },
            {
                id: 'q4',
                title: 'Q4. 【意思疎通チェック】作ってくれた手料理で「一番美味しかったもの（得意料理）」',
                isRanking: false
            },
            {
                id: 'q5',
                title: 'Q5. 【意思疎通チェック】相手から貰ったプレゼントで、嬉しかったものランキング',
                isRanking: true
            },
            {
                id: 'q6',
                title: 'Q6. 【意思疎通チェック】魁さん・偲桜さんから見て「二人の一番似ているところ（共通点）」',
                isRanking: false
            },
            {
                id: 'q7',
                title: 'Q7. 相手の「こういうところが本当に素敵で、尊敬できる！」と思う部分',
                isRanking: false
            },
            {
                id: 'q8',
                title: 'Q8. 相手の「直さなくてもいいけれど、実はちょっと面白いな・可愛らしいな」と思う癖や習慣',
                isRanking: false
            },
            {
                id: 'q9',
                title: 'Q9. プロポーズのシチュエーションやその時の感想・裏話',
                isRanking: false
            },
            {
                id: 'q10',
                title: 'Q10. 照れくさくて普段言えない、相手への「ちょっとした感謝の気持ち」やメッセージ',
                isRanking: false
            }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            loadResults();

            document.getElementById('btn-show-real').addEventListener('click', () => {
                showTestMode = false;
                toggleViewButtons();
                renderResults();
            });

            document.getElementById('btn-show-test').addEventListener('click', () => {
                showTestMode = true;
                toggleViewButtons();
                renderResults();
            });
        });

        function toggleViewButtons() {
            const btnReal = document.getElementById('btn-show-real');
            const btnTest = document.getElementById('btn-show-test');
            
            if (showTestMode) {
                btnTest.style.backgroundColor = 'var(--accent-color)';
                btnReal.style.backgroundColor = '#5f6368';
            } else {
                btnReal.style.backgroundColor = 'var(--accent-color)';
                btnTest.style.backgroundColor = '#5f6368';
            }
        }

        async function loadResults() {
            try {
                const response = await fetch('api.php?action=get&t=' + Date.now());
                const result = await response.json();
                if (result.status === 'success') {
                    serverData = result.results;
                    renderResults();
                } else {
                    document.getElementById('loading-el').innerHTML = `<p style="color: #d32f2f;">データの読み込みに失敗しました: ${result.message}</p>`;
                }
            } catch (err) {
                console.error(err);
                document.getElementById('loading-el').innerHTML = `<p style="color: #d32f2f;">通信エラーが発生しました。</p>`;
            }
        }

        function renderResults() {
            if (!serverData) return;

            const container = document.getElementById('results-container');
            container.innerHTML = '';

            const hasGroom = !!serverData.groom;
            const hasBride = !!serverData.bride;
            const hasTestGroom = !!serverData.nayuta_groom;
            const hasTestBride = !!serverData.nayuta_bride;

            // テスト表示モードの自動選択
            if (!showTestMode && (hasTestGroom || hasTestBride) && !hasGroom && !hasBride) {
                showTestMode = true;
                toggleViewButtons();
            }

            QUIZ_QUESTIONS.forEach(question => {
                const section = document.createElement('section');
                section.className = 'question-card';
                section.style.borderTop = '3px solid var(--border-color)';
                
                const title = document.createElement('h3');
                title.style.fontSize = '1.05rem';
                title.style.marginBottom = '1.2rem';
                title.style.color = 'var(--text-primary)';
                title.style.borderBottom = '1px solid #f1f3f4';
                title.style.paddingBottom = '0.5rem';
                title.textContent = question.title;
                section.appendChild(title);

                const grid = document.createElement('div');
                grid.className = showTestMode ? 'results-grid three-cols' : 'results-grid';

                // 1. 新郎 (魁さん) の回答
                const colGroom = document.createElement('div');
                colGroom.className = 'role-column';
                colGroom.innerHTML = `<div class="role-header groom">🤵 新郎・魁さん</div>`;
                const ansGroomCard = document.createElement('div');
                ansGroomCard.className = 'answer-card';
                ansGroomCard.style.borderLeft = '3px solid #1a73e8';
                
                if (hasGroom) {
                    renderAnswerContent(ansGroomCard, serverData.groom.answers[question.id], question.isRanking);
                    colGroom.innerHTML += `<div class="meta-status">回答日時: ${serverData.groom.updated_at}</div>`;
                } else {
                    ansGroomCard.innerHTML = `<p style="color: var(--text-secondary); font-style: italic; text-align: center; font-size: 0.85rem;">未回答</p>`;
                }
                colGroom.insertBefore(ansGroomCard, colGroom.firstChild.nextSibling);
                grid.appendChild(colGroom);

                // 2. 新婦 (偲桜さん) の回答
                const colBride = document.createElement('div');
                colBride.className = 'role-column';
                colBride.innerHTML = `<div class="role-header bride">👰 新婦・偲桜さん</div>`;
                const ansBrideCard = document.createElement('div');
                ansBrideCard.className = 'answer-card';
                ansBrideCard.style.borderLeft = '3px solid #e91e63';
                
                if (hasBride) {
                    renderAnswerContent(ansBrideCard, serverData.bride.answers[question.id], question.isRanking);
                    colBride.innerHTML += `<div class="meta-status">回答日時: ${serverData.bride.updated_at}</div>`;
                } else {
                    ansBrideCard.innerHTML = `<p style="color: var(--text-secondary); font-style: italic; text-align: center; font-size: 0.85rem;">未回答</p>`;
                }
                colBride.insertBefore(ansBrideCard, colBride.firstChild.nextSibling);
                grid.appendChild(colBride);

                // 3. テストデータ
                if (showTestMode) {
                    const colTest = document.createElement('div');
                    colTest.className = 'role-column';
                    colTest.innerHTML = `<div class="role-header nayuta">👤 テスト回答 (那由他さん)</div>`;
                    
                    const ansTestCard = document.createElement('div');
                    ansTestCard.className = 'answer-card';
                    ansTestCard.style.borderLeft = '3px solid #3f51b5';

                    let testHtml = '';
                    if (hasTestGroom) {
                        testHtml += `<h5 style="color: #1557b0; font-size: 0.8rem; margin-bottom: 0.3rem;">新郎役としてテスト入力:</h5>`;
                        const tempDiv = document.createElement('div');
                        renderAnswerContent(tempDiv, serverData.nayuta_groom.answers[question.id], question.isRanking);
                        testHtml += tempDiv.innerHTML;
                    }
                    if (hasTestBride) {
                        if (hasTestGroom) testHtml += `<hr style="margin: 0.8rem 0; border: none; border-top: 1px dashed var(--border-color);">`;
                        testHtml += `<h5 style="color: #c2185b; font-size: 0.8rem; margin-bottom: 0.3rem;">新婦役としてテスト入力:</h5>`;
                        const tempDiv = document.createElement('div');
                        renderAnswerContent(tempDiv, serverData.nayuta_bride.answers[question.id], question.isRanking);
                        testHtml += tempDiv.innerHTML;
                    }
                    
                    if (!hasTestGroom && !hasTestBride) {
                        ansTestCard.innerHTML = `<p style="color: var(--text-secondary); font-style: italic; text-align: center; font-size: 0.85rem;">未入力</p>`;
                    } else {
                        ansTestCard.innerHTML = testHtml;
                    }
                    colTest.appendChild(ansTestCard);
                    grid.appendChild(colTest);
                }

                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        // 回答コンテンツの描画ユーティリティ
        function renderAnswerContent(element, data, isRanking) {
            if (!data) {
                element.innerHTML = `<p style="color: var(--text-secondary); font-style: italic; text-align: center; font-size: 0.85rem;">未回答</p>`;
                return;
            }

            if (isRanking) {
                element.innerHTML = `
                    <div class="ranking-list">
                        <div class="ranking-item"><span style="color:#b45309; font-weight:700; font-size:0.85rem;">1位:</span> <span style="font-size:0.9rem;">${escapeHtml(data[1])}</span></div>
                        <div class="ranking-item"><span style="color:#4b5563; font-weight:700; font-size:0.85rem;">2位:</span> <span style="font-size:0.9rem;">${escapeHtml(data[2])}</span></div>
                        <div class="ranking-item"><span style="color:#c2410c; font-weight:700; font-size:0.85rem;">3位:</span> <span style="font-size:0.9rem;">${escapeHtml(data[3])}</span></div>
                    </div>
                `;
            } else {
                element.innerHTML = `<div class="value">${escapeHtml(data)}</div>`;
            }
        }

        function escapeHtml(str) {
            if (typeof str !== 'string') return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        async function clearData(target) {
            if (confirm(`${target} のアンケートデータをサーバーから完全に削除しますか？`)) {
                try {
                    const response = await fetch(`api.php?action=clear&target=${target}`, {
                        method: 'POST'
                    });
                    const result = await response.json();
                    if (result.status === 'success') {
                        alert(result.message);
                        loadResults();
                    } else {
                        alert('削除エラー: ' + result.message);
                    }
                } catch (err) {
                    console.error(err);
                    alert('通信に失敗しました。');
                }
            }
        }
    </script>
</body>
</html>
